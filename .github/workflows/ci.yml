name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - tools/shopee_local_studio
          - tools/image2_generator
          - tools/bigseller_draft_filler

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ${{ matrix.module }}
        run: npm install

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: npm test
      - name: Check public release files
        if: matrix.module == 'tools/shopee_local_studio'
        run: node scripts/check-release-files.mjs
      - name: Verify update and rollback
        if: matrix.module == 'tools/shopee_local_studio'
        shell: powershell
        run: ./scripts/test-deployment.ps1
