name: Stable release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module: [tools/shopee_local_studio, tools/bigseller_draft_filler, tools/image2_generator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: ${{ matrix.module }}
      - run: npm test
        working-directory: ${{ matrix.module }}
      - name: Check release file boundaries
        if: matrix.module == 'tools/shopee_local_studio'
        run: node scripts/check-release-files.mjs
      - name: Test update and rollback with isolated fixtures
        if: matrix.module == 'tools/shopee_local_studio'
        shell: powershell
        run: ./scripts/test-deployment.ps1
  publish:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package committed source only
        shell: powershell
        run: |
          $version = (Get-Content VERSION.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Version/tag mismatch' }
          git archive --format=zip --prefix=shopee-local-studio/ --output=shopee-local-studio.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          (Get-FileHash shopee-local-studio.zip -Algorithm SHA256).Hash.ToLower() + '  shopee-local-studio.zip' | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item -LiteralPath './升级旧版.ps1' -Destination upgrade-existing.ps1
          gh release create $env:GITHUB_REF_NAME shopee-local-studio.zip SHA256SUMS.txt upgrade-existing.ps1 --verify-tag --title "Shopee Local Studio $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
